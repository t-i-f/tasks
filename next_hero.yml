version: '3'

vars:
  CSS_FILE: app/globals.css
  LAYOUT_FILE: app/layout.tsx
  PROVIDERS_FILE: app/providers.tsx
  HERO_CONFIG: app/hero.ts

tasks:
  default:
    desc: "Setup HeroUI: Config, Providers, CSS, and Layout wrap"
    cmds:
      - bun add @heroui/react framer-motion
      - task: create-hero-ts
      - task: create-providers
      - task: update-css
      - task: inject-layout

  create-hero-ts:
    desc: "Creates hero.ts config"
    cmds:
      - |
        cat <<EOF > {{.HERO_CONFIG}}
        // hero.ts
        import { heroui } from "@heroui/react";
        export default heroui();
        EOF
      - echo "✅ Created {{.HERO_CONFIG}}"

  create-providers:
    desc: "Creates client-side providers wrapper"
    cmds:
      - |
        cat <<EOF > {{.PROVIDERS_FILE}}
        "use client";

        import * as React from "react";
        import { HeroUIProvider } from "@heroui/react";

        export function Providers({ children }: { children: React.ReactNode }) {
          return (
            <HeroUIProvider>
              {children}
            </HeroUIProvider>
          );
        }
        EOF
      - echo "✅ Created {{.PROVIDERS_FILE}}"

  update-css:
    desc: "Updates globals.css with Tailwind 4 & Hero config"
    cmds:
      - |
        cat <<EOF > {{.CSS_FILE}}
        @import "tailwindcss";
        @plugin './hero.ts';
        @source '../../node_modules/@heroui/theme/dist/**/*.{js,ts,jsx,tsx}';
        @custom-variant dark (&:is(.dark *));
        EOF
      - echo "✅ Updated {{.CSS_FILE}}"

  inject-layout:
    desc: "Injects Providers into layout.tsx"
    cmds:
      # We use a temp file approach to be safe with sed across different OS versions
      - echo "Injecting imports..."
      - sed '1s/^/import { Providers } from ".\/providers";\n/' {{.LAYOUT_FILE}} > {{.LAYOUT_FILE}}.tmp && mv {{.LAYOUT_FILE}}.tmp {{.LAYOUT_FILE}}
      
      - echo "Wrapping children..."
      - sed 's/{children}/<Providers>{children}<\/Providers>/' {{.LAYOUT_FILE}} > {{.LAYOUT_FILE}}.tmp && mv {{.LAYOUT_FILE}}.tmp {{.LAYOUT_FILE}}
      
      - echo "✅ Wrapped children in {{.LAYOUT_FILE}}"